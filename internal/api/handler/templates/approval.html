<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Authorize request</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --fg: #0f172a;
      --muted: #64748b;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --accent: #0f766e;
      --danger: #dc2626;
      --highlight: #fef3c7;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      margin: 0; padding: 3rem 1rem;
      background: var(--bg); color: var(--fg);
      max-width: 520px; margin-inline: auto;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem;
    }
    h1 { font-size: 1.25rem; margin: 0 0 0.5rem; }
    .lead { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.95rem; }
    .client {
      font-size: 0.875rem; color: var(--muted); margin: 0 0 1rem;
    }
    .client code {
      background: #f1f5f9; padding: 0.1rem 0.4rem; border-radius: 4px;
    }
    .binding {
      background: var(--highlight);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      font-size: 1rem;
      font-weight: 500;
      margin: 0 0 1.5rem;
      line-height: 1.4;
    }
    .actions { display: flex; gap: 0.6rem; }
    button {
      flex: 1;
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: white; }
    button.secondary { background: transparent; color: var(--danger); border: 1px solid var(--border); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .status { margin-top: 1rem; font-size: 0.85rem; color: var(--muted); min-height: 1.2em; }
    .status.error { color: var(--danger); }
    .terminal {
      text-align: center; margin-top: 1.5rem; font-size: 0.95rem; color: var(--muted);
    }
    .terminal.success { color: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <h1>Approve this request?</h1>
    <p class="lead">Confirm with your passkey to authorize the action below.</p>
    <p class="client">Continuing to <code>{{.ClientName}}</code></p>

    <p class="binding">{{.BindingMessage}}</p>

    <div class="actions">
      <button id="authorize" class="primary" type="button">Authorize with passkey</button>
      <button id="deny" class="secondary" type="button">Deny</button>
    </div>
    <p id="status" class="status" role="status"></p>
  </main>

  <script>
    "use strict";

    const approvalToken = {{.ApprovalToken | js}};

    function b64uToBuf(str) {
      const pad = "=".repeat((4 - (str.length % 4)) % 4);
      const std = (str + pad).replace(/-/g, "+").replace(/_/g, "/");
      const bin = atob(std);
      const buf = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
      return buf.buffer;
    }

    function bufToB64u(buf) {
      const bytes = new Uint8Array(buf);
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    function prepRequestOptions(options) {
      const o = { ...options };
      o.challenge = b64uToBuf(options.challenge);
      if (options.allowCredentials) {
        o.allowCredentials = options.allowCredentials.map(c => ({ ...c, id: b64uToBuf(c.id) }));
      }
      return o;
    }

    function assertionToWire(cred) {
      return {
        id: cred.id,
        rawId: bufToB64u(cred.rawId),
        type: cred.type,
        response: {
          clientDataJSON:    bufToB64u(cred.response.clientDataJSON),
          authenticatorData: bufToB64u(cred.response.authenticatorData),
          signature:         bufToB64u(cred.response.signature),
          userHandle:        cred.response.userHandle ? bufToB64u(cred.response.userHandle) : null,
        },
      };
    }

    async function api(path, body) {
      const res = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      const text = await res.text();
      let parsed = null;
      try { parsed = text ? JSON.parse(text) : null; } catch (_) { /* keep null */ }
      return { ok: res.ok, status: res.status, body: parsed };
    }

    function setStatus(msg, isError) {
      const el = document.getElementById("status");
      el.textContent = msg || "";
      el.classList.toggle("error", !!isError);
    }

    function showTerminal(msg, kind) {
      const main = document.querySelector(".card");
      while (main.firstChild) {
        main.removeChild(main.firstChild);
      }
      const div = document.createElement("div");
      div.className = kind ? "terminal " + kind : "terminal";
      div.textContent = msg;
      main.appendChild(div);
    }

    function lockButtons(locked) {
      document.getElementById("authorize").disabled = locked;
      document.getElementById("deny").disabled = locked;
    }

    document.getElementById("authorize").addEventListener("click", async () => {
      lockButtons(true);
      setStatus("Waiting for passkey…");

      try {
        const begin = await api("/ciba/approve/login/begin", { t: approvalToken });
        if (!begin.ok) {
          setStatus(begin.body && begin.body.error_description || "Could not start sign-in.", true);
          lockButtons(false);
          return;
        }

        const cred = await navigator.credentials.get({
          publicKey: prepRequestOptions(begin.body.options),
        });
        if (!cred) {
          setStatus("The passkey prompt was cancelled.", true);
          lockButtons(false);
          return;
        }

        const complete = await api("/ciba/approve", {
          t:                  approvalToken,
          passkey_session_id: begin.body.session_id,
          credential:         assertionToWire(cred),
        });
        if (!complete.ok) {
          setStatus(complete.body && complete.body.error_description || "Approval failed.", true);
          lockButtons(false);
          return;
        }

        showTerminal("Authorized. You can close this page.", "success");
      } catch (e) {
        setStatus(e && e.message ? e.message : String(e), true);
        lockButtons(false);
      }
    });

    document.getElementById("deny").addEventListener("click", async () => {
      lockButtons(true);
      setStatus("Marking as denied…");

      try {
        const res = await api("/ciba/deny", { t: approvalToken });
        if (!res.ok) {
          setStatus(res.body && res.body.error_description || "Could not record denial.", true);
          lockButtons(false);
          return;
        }
        showTerminal("Request denied. You can close this page.");
      } catch (e) {
        setStatus(e && e.message ? e.message : String(e), true);
        lockButtons(false);
      }
    });
  </script>
</body>
</html>
